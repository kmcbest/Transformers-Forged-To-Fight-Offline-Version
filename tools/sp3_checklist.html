<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TFTF SP3 角色变形时序调试清单 (SP3 Timings Checklist)</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131d31;
      --card-border: #1e2e4a;
      --table-row-hover: #1a2742;
      --table-border: #1e293b;
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.25);
      --accent: #f43f5e;
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.25);
      --warning: #f59e0b;
      --warning-glow: rgba(245, 158, 11, 0.2);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --input-bg: #090d16;
      --input-border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 20px 24px;
      min-height: 100vh;
    }
    .wrapper {
      max-width: 1400px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }
    .title-area h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.02em;
    }
    .title-area h1 span.logo-tag {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #0b0f19;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 900;
      letter-spacing: 0.05em;
    }
    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    /* Progress & Stats Card */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    @media (max-width: 900px) {
      .dashboard-grid { grid-template-columns: 1fr; }
    }

    .dash-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .progress-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-main);
    }
    .progress-stat {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--primary);
    }
    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: #090d16;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      margin-bottom: 12px;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #38bdf8);
      width: 0%;
      transition: width 0.4s ease;
      border-radius: 6px;
    }
    .stat-chips {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .stat-chip {
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      background: #090d16;
      border: 1px solid var(--card-border);
    }

    /* Built-in Compact Calculator */
    .calc-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .calc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .calc-inputs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    @media (max-width: 600px) {
      .calc-inputs { grid-template-columns: 1fr 1fr; }
    }
    .calc-field label {
      display: block;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 3px;
      font-weight: 600;
    }
    .calc-field input, .calc-field select {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 6px;
      padding: 6px 8px;
      color: #fff;
      font-size: 0.82rem;
      font-family: ui-monospace, Consolas, monospace;
      outline: none;
    }
    .calc-field input:focus, .calc-field select:focus {
      border-color: var(--primary);
    }
    .calc-result-row {
      display: flex;
      gap: 8px;
      align-items: center;
      background: #090d16;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }
    .calc-code {
      flex: 1;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 1rem;
      font-weight: 700;
      color: #38bdf8;
    }

    /* Controls & Filter Bar */
    .filter-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .filter-row-primary {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1;
      min-width: 250px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      padding: 9px 14px 9px 36px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
    }
    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
    .search-box::before {
      content: "🔍";
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.85rem;
      opacity: 0.6;
    }
    .tab-group {
      display: flex;
      gap: 6px;
      background: #090d16;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }
    .tab-btn {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      background: transparent;
      color: var(--text-muted);
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--card-bg);
      color: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    .tab-btn:hover:not(.active) {
      color: #fff;
    }

    .category-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .pill-btn {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.76rem;
      font-weight: 600;
      border: 1px solid var(--card-border);
      background: #090d16;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .pill-btn.active {
      background: var(--primary);
      color: #0b0f19;
      border-color: var(--primary);
      font-weight: 700;
    }
    .pill-btn:hover:not(.active) {
      border-color: var(--primary);
      color: #fff;
    }

    /* Table Styling */
    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th {
      background: #0d1525;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 12px 16px;
      border-bottom: 1px solid var(--card-border);
      user-select: none;
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--table-border);
      font-size: 0.85rem;
      vertical-align: middle;
    }
    tr.calibrated-row {
      background: rgba(16, 185, 129, 0.03);
    }
    tr.uncalibrated-row {
      background: transparent;
    }
    tr:hover {
      background-color: var(--table-row-hover) !important;
    }

    /* Badges & Elements */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .badge-calibrated {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .badge-uncalibrated {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .badge-category {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }
    .bot-id {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.82rem;
      color: #93c5fd;
      cursor: pointer;
      display: inline-block;
      padding: 2px 4px;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.08);
    }
    .bot-id:hover {
      text-decoration: underline;
      background: rgba(56, 189, 248, 0.2);
    }
    .bot-name {
      font-size: 0.92rem;
      font-weight: 700;
      color: #f8fafc;
    }
    .bot-notes {
      color: var(--text-muted);
      font-size: 0.78rem;
      margin-top: 2px;
    }
    .timing-val {
      font-family: ui-monospace, Consolas, monospace;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 4px 8px;
      border-radius: 6px;
      background: #090d16;
      display: inline-block;
      border: 1px solid var(--card-border);
    }
    .timing-calibrated {
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.4);
    }
    .timing-default {
      color: #f59e0b;
      border-color: rgba(245, 158, 11, 0.3);
    }

    .btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #334155;
      border-color: #475569;
    }
    .btn-primary {
      background: #0284c7;
      border-color: #0369a1;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
    .btn-success {
      background: #059669;
      border-color: #047857;
    }
    .btn-success:hover {
      background: #047857;
    }
    .btn-sm {
      padding: 4px 8px;
      font-size: 0.72rem;
    }

    .actions-cell {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* Custom Checkbox */
    .check-container {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .custom-checkbox {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 2px solid #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      background: #090d16;
    }
    .custom-checkbox.checked {
      background: #10b981;
      border-color: #10b981;
    }
    .custom-checkbox.checked::after {
      content: "✓";
      color: #fff;
      font-size: 12px;
      font-weight: 900;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #10b981;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: all 0.25s ease;
      z-index: 1000;
    }
    #toast.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* Empty state */
    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <div class="title-area">
        <h1>
          TFTF SP3 角色变形时序调试清单
          <span class="logo-tag">OFFLINE VER</span>
        </h1>
        <div class="subtitle">全面跟踪记录全角色 SP3 载具/野兽动画生效区间 (只统计 72 个具备实际模具与ODR文件的独立角色)</div>
      </div>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="exportModifiedTimings()">💾 导出最新 sp3_timings.json</button>
        <button class="btn" onclick="exportPendingList()">📋 导出待调整名单</button>
        <button class="btn" onclick="resetChecklistState()">🔄 重置勾选缓存</button>
      </div>
    </header>

    <!-- Dashboard & Calculator -->
    <div class="dashboard-grid">
      <!-- Progress Summary -->
      <div class="dash-card">
        <div class="progress-header">
          <span class="progress-title">📊 调整完成进度</span>
          <span class="progress-stat" id="statProgressPct">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
        <div class="stat-chips">
          <div class="stat-chip">
            <span style="color: #94a3b8;">角色总数:</span>
            <strong id="statTotal" style="color: #fff;">142</strong>
          </div>
          <div class="stat-chip">
            <span style="color: #34d399;">🟢 已校准:</span>
            <strong id="statCalibrated" style="color: #34d399;">0</strong>
          </div>
          <div class="stat-chip">
            <span style="color: #fbbf24;">🟡 待调整:</span>
            <strong id="statUncalibrated" style="color: #fbbf24;">0</strong>
          </div>
          <div class="stat-chip">
            <span style="color: #38bdf8;">✓ 本地已标记:</span>
            <strong id="statLocalChecked" style="color: #38bdf8;">0</strong>
          </div>
        </div>
      </div>

      <!-- Quick Calculator -->
      <div class="dash-card">
        <div class="calc-box">
          <div class="calc-header">
            <strong style="font-size: 0.9rem; color: #fff;">⏱️ 极速时间戳计算器</strong>
            <span style="font-size: 0.75rem; color: #94a3b8;">支持 00:01:05;23 或 01:05.23</span>
          </div>
          <div class="calc-inputs">
            <div class="calc-field">
              <label>S3开始时间 (T1)</label>
              <input type="text" id="calcT1" placeholder="00:00:00;00" value="00:00:00;00">
            </div>
            <div class="calc-field">
              <label>变载具时刻 (T2)</label>
              <input type="text" id="calcT2" placeholder="00:00:02;00" value="00:00:02;00">
            </div>
            <div class="calc-field">
              <label>变回人时刻 (T3)</label>
              <input type="text" id="calcT3" placeholder="00:00:03;07" value="00:00:03;07">
            </div>
            <div class="calc-field">
              <label>帧率 (FPS)</label>
              <select id="calcFps">
                <option value="30" selected>30 FPS</option>
                <option value="60">60 FPS</option>
                <option value="29.97">29.97 FPS</option>
                <option value="24">24 FPS</option>
              </select>
            </div>
          </div>
          <div class="calc-result-row">
            <span style="font-size: 0.75rem; color: #94a3b8;">计算结果:</span>
            <div class="calc-code" id="calcResult">[[2000, 3233]],</div>
            <button class="btn btn-primary btn-sm" onclick="copyCalcResult()">📋 复制结果</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Filter & Search Controls -->
    <div class="filter-section">
      <div class="filter-row-primary">
        <div class="search-box">
          <input type="text" id="searchKeyword" placeholder="搜索角色名、英文ID (如 optimus, arcee)、车型、动作关键词..." oninput="filterData()">
        </div>
        <div class="tab-group">
          <button class="tab-btn active" id="tabAll" onclick="setStatusFilter('all')">全部 (<span id="cntAll">142</span>)</button>
          <button class="tab-btn" id="tabPending" onclick="setStatusFilter('pending')">🟡 待调整 (<span id="cntPending">79</span>)</button>
          <button class="tab-btn" id="tabDone" onclick="setStatusFilter('done')">🟢 已校准 (<span id="cntDone">63</span>)</button>
        </div>
      </div>
      <div class="category-pills" id="categoryPills">
        <!-- populated dynamically -->
      </div>
    </div>

    <!-- Table -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width: 48px; text-align: center;">标记</th>
            <th style="width: 160px;">角色名称 / 阵营</th>
            <th style="width: 220px;">Bot ID (代码标识)</th>
            <th style="width: 130px;">类别</th>
            <th>载具 / 野兽形态与动作说明</th>
            <th style="width: 170px;">当前变形时序区间 (ms)</th>
            <th style="width: 160px;">操作</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- populated dynamically -->
        </tbody>
      </table>
      <div id="emptyState" class="empty-state" style="display: none;">
        未找到匹配的角色记录
      </div>
    </div>
  </div>

  <div id="toast">复制成功！</div>

          <td style="text-align: center;">
            <div class="check-container" onclick="toggleUserCheck('${item.id}')">
              <div class="custom-checkbox ${isChecked ? 'checked' : ''}" id="chk_${item.id}"></div>
            </div>
          </td>
          <td>
            <div class="bot-name">${escapeHtml(item.zh)}</div>
            <div style="font-size: 0.75rem; color: #94a3b8; margin-top: 2px;">
              ${item.faction ? `<span class="badge badge-category" style="padding: 1px 5px; font-size: 0.68rem;">${item.faction}</span>` : ''}
            </div>
          </td>
          <td>
            <code class="bot-id" onclick="copyText('${item.id}', '已复制 Bot ID: ${item.id}')">${item.id}</code>
          </td>
          <td>
            <span class="badge badge-category">${item.category}</span>
          </td>
          <td>
            <div class="bot-notes">${escapeHtml(item.note)}</div>
          </td>
          <td>
            <span class="timing-val ${item.is_calibrated ? 'timing-calibrated' : 'timing-default'}">${timingStr}</span>
            ${item.is_calibrated ? '<span class="badge badge-calibrated" style="margin-left: 6px;">已校准</span>' : '<span class="badge badge-uncalibrated" style="margin-left: 6px;">待调整</span>'}
          </td>
          <td>
            <div class="actions-cell">
              <button class="btn btn-sm" onclick="copyInterval('${item.id}', '${timingStr}')">📋 复制</button>
              <button class="btn btn-sm btn-primary" onclick="applyCalcToBot('${item.id}')">⏱️ 填入计算</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function toggleUserCheck(botId) {
      userCheckedMap[botId] = !userCheckedMap[botId];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(userCheckedMap));
      const el = document.getElementById('chk_' + botId);
      if (el) {
        el.classList.toggle('checked', userCheckedMap[botId]);
      }
      updateDashboard();
    }

    function copyInterval(botId, val) {
      const text = `"intervals": ${val},`;
      copyText(text, `已复制 ${botId} 的时序配置: ${text}`);
    }

    function applyCalcToBot(botId) {
      const resultText = document.getElementById('calcResult').textContent.trim();
      // Parse interval from calculator
      try {
        let clean = resultText.replace(/,$/, '');
        let parsed = JSON.parse(clean);
        let found = items.find(x => x.id === botId);
        if (found) {
          found.intervals = parsed;
          found.is_calibrated = (parsed[0][0] !== 1000 || parsed[0][1] !== 2500);
          userCheckedMap[botId] = true;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(userCheckedMap));
          updateDashboard();
          renderTable();
          showToast(`已更新 ${found.zh} (${botId}) 的时序为 ${resultText}`);
        }
      } catch(e) {
        showToast('解析计算结果失败，请先核对时间戳格式');
      }
    }

    // Calculator Logic
    function bindCalcEvents() {
      ['calcT1', 'calcT2', 'calcT3', 'calcFps'].forEach(id => {
        document.getElementById(id).addEventListener('input', calculate);
        document.getElementById(id).addEventListener('change', calculate);
      });
    }

    function parseTimecode(tcStr, fps) {
      tcStr = tcStr.trim();
      let parts = tcStr.split(/[:;\.]/);
      let h = 0, m = 0, s = 0, f = 0;
      if (parts.length === 4) {
        h = parseFloat(parts[0]) || 0;
        m = parseFloat(parts[1]) || 0;
        s = parseFloat(parts[2]) || 0;
        f = parseFloat(parts[3]) || 0;
      } else if (parts.length === 3) {
        m = parseFloat(parts[0]) || 0;
        s = parseFloat(parts[1]) || 0;
        f = parseFloat(parts[2]) || 0;
      } else if (parts.length === 2) {
        s = parseFloat(parts[0]) || 0;
        f = parseFloat(parts[1]) || 0;
      } else if (parts.length === 1) {
        s = parseFloat(parts[0]) || 0;
      }
      let totalSec = h * 3600 + m * 60 + s + (f / fps);
      return totalSec * 1000.0;
    }

    function calculate() {
      const fps = parseFloat(document.getElementById('calcFps').value) || 30;
      const t1 = parseTimecode(document.getElementById('calcT1').value, fps);
      const t2 = parseTimecode(document.getElementById('calcT2').value, fps);
      const t3 = parseTimecode(document.getElementById('calcT3').value, fps);

      let startMs = Math.round(t2 - t1);
      let endMs = Math.round(t3 - t1);

      if (startMs < 0) startMs = 0;
      if (endMs < startMs) endMs = startMs;

      const formatted = `[[${startMs}, ${endMs}]],`;
      document.getElementById('calcResult').textContent = formatted;
    }

    function copyCalcResult() {
      const text = document.getElementById('calcResult').textContent.trim();
      copyText(text, '已复制计算结果: ' + text);
    }

    function exportModifiedTimings() {
      // Update timings object
      const exported = JSON.parse(JSON.stringify(RAW_TIMINGS));
      items.forEach(item => {
        if (exported[item.id]) {
          exported[item.id].intervals = item.intervals;
        } else {
          exported[item.id] = {
            intervals: item.intervals,
            notes: item.note
          };
        }
      });

      // Format clean JSON with single line intervals
      let jsonLines = ['{'];
      const keys = Object.keys(exported);
      keys.forEach((k, idx) => {
        const isLast = (idx === keys.length - 1);
        const comma = isLast ? '' : ',';
        const v = exported[k];
        jsonLines.push(`  "${k}": {`);
        jsonLines.push(`    "intervals": ${JSON.stringify(v.intervals)},`);
        jsonLines.push(`    "notes": ${JSON.stringify(v.notes)}`);
        jsonLines.push(`  }${comma}`);
      });
      jsonLines.push('}');
      const fullJson = jsonLines.join('\n');

      downloadFile('sp3_timings.json', fullJson, 'application/json');
      showToast('已生成并下载最新的 sp3_timings.json！');
    }

    function exportPendingList() {
      const pending = items.filter(x => !x.is_calibrated);
      let md = '# 待校准角色清单 (共 ' + pending.length + ' 个)\n\n';
      md += '| 编号 | 角色名称 | Bot ID | 分类 | 动作说明 | 当前时序 |\n';
      md += '| :--- | :--- | :--- | :--- | :--- | :--- |\n';
      pending.forEach((x, i) => {
        md += `| ${i + 1} | ${x.zh} | \`${x.id}\` | ${x.category} | ${x.note} | \`${JSON.stringify(x.intervals)}\` |\n`;
      });
      downloadFile('sp3_pending_characters.md', md, 'text/markdown');
      showToast('已导出待调整名单 Markdown！');
    }

    function resetChecklistState() {
      if (confirm('确定要清除本地的手动勾选记录吗？（不会丢失已修改的时序数值）')) {
        userCheckedMap = {};
        localStorage.removeItem(STORAGE_KEY);
        updateDashboard();
        renderTable();
        showToast('已重置本地勾选状态');
      }
    }

    function downloadFile(filename, content, type) {
      const blob = new Blob([content], { type: type + ';charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function copyText(text, successMsg) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(successMsg || '已复制到剪贴板！');
        }).catch(() => {
          fallbackCopy(text, successMsg);
        });
      } else {
        fallbackCopy(text, successMsg);
      }
    }

    function fallbackCopy(text, successMsg) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast(successMsg || '已复制到剪贴板！');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2600);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
